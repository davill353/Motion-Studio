<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>html,body{margin:0;height:100%;background:#fff}#m{height:100%}

.cdot{width:16px;height:16px;border-radius:50%;background:#0E7C5A;border:2px solid #fff;box-shadow:0 0 0 1px #0E7C5A}

</style></head><body><div id="m"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

map.fitBounds(L.latLngBounds(R.concat(C).map(p=>[p.lat,p.lon])),{padding:[70,70]});
